<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별의 거리와 밝기 시뮬레이션</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  position: relative;
  background: radial-gradient(ellipse at 50% -10%, #16233a 0%, #0a1220 55%, #050810 100%);
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 40px; color: #eee; overflow-x: hidden;
}
body::before{
  content:''; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,.55) 1px, transparent 1px),
    radial-gradient(1px 1px at 78% 15%, rgba(255,255,255,.4) 1px, transparent 1px),
    radial-gradient(1.6px 1.6px at 35% 78%, rgba(255,255,255,.5) 1px, transparent 1px),
    radial-gradient(1px 1px at 92% 55%, rgba(255,255,255,.4) 1px, transparent 1px),
    radial-gradient(1.2px 1.2px at 58% 38%, rgba(255,255,255,.35) 1px, transparent 1px),
    radial-gradient(1.6px 1.6px at 8% 62%, rgba(255,255,255,.5) 1px, transparent 1px),
    radial-gradient(1px 1px at 88% 85%, rgba(255,255,255,.4) 1px, transparent 1px),
    radial-gradient(1px 1px at 45% 92%, rgba(255,255,255,.35) 1px, transparent 1px);
  background-repeat: no-repeat;
}

h1 { font-size: 38px; font-weight: 700; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.guide { font-size: 21px; font-weight: 600; color: #a9c6e8; margin-bottom: 4px; text-align: center; max-width: 900px; line-height: 1.5; }
.subnote { font-size: 15px; color: #5f7797; margin-bottom: 18px; text-align: center; max-width: 800px; }

.stage-wrap { position: relative; width: 100%; max-width: 1080px; margin-top: 22px; }
.formula-badge {
  position: absolute; top: 14px; right: 14px;
  background: #fffdf5; color: #3a2f00; border-radius: 10px;
  padding: 9px 20px; font-size: 22px; font-weight: 800;
  box-shadow: 0 4px 16px rgba(0,0,0,.5); letter-spacing: .5px;
  z-index: 2;
}
.legend {
  position: absolute; top: 14px; left: 14px; z-index: 2;
  background: rgba(5,10,20,.55); border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px; padding: 10px 16px; font-size: 14px; color: #cfe4f2;
  line-height: 1.7;
}
.legend span.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }

#mainCanvas { display: block; width: 100%; height: auto; border-radius: 18px; background: #050912; box-shadow: 0 10px 44px rgba(0,0,0,.6); }

.controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 22px; width: 100%; max-width: 720px; }
.slider-row { display: flex; align-items: center; gap: 14px; width: 100%; font-size: 19px; }
input[type=range] { flex: 1; accent-color: #FFD54F; height: 7px; cursor: pointer; }
.jump-btns { display: flex; gap: 10px; }
.jump-btns button {
  padding: 9px 22px; border-radius: 10px; border: 2px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: #cfe4f2; font-size: 18px; font-weight: 700; cursor: pointer;
  transition: all .15s;
}
.jump-btns button:hover { border-color: rgba(255,255,255,.35); }
.jump-btns button.active { background: rgba(255,213,79,.25); border-color: #FFD54F; color: #fff; box-shadow: 0 0 12px rgba(255,213,79,.5); }

.stats-bar {
  display: flex; gap: 40px; margin-top: 20px; flex-wrap: wrap; justify-content: center;
}
.stat-pill {
  background: rgba(255,255,255,0.06); border-radius: 14px; padding: 12px 26px;
  text-align: center; min-width: 160px;
}
.stat-pill .label { font-size: 14px; color: #7fa3bd; font-weight: 700; margin-bottom: 4px; }
.stat-pill .value { font-size: 28px; font-weight: 800; }
#statDist { color: #FFD54F; }
#statBright { color: #FF8A65; }
</style>
</head>
<body>
<h1>⭐ 별의 거리와 밝기</h1>
<p class="guide">별빛은 별을 중심으로 사방(구 형태)으로 고르게 퍼져나가요. 우리 눈은 그 넓은 구 표면 중 아주 작은 한 조각만 바라보는 셈이죠. 거리가 멀어질수록 같은 조각에 닿는 빛의 양이 줄어들어, 별은 점점 더 어둡게 보여요.</p>
<p class="subnote">※ 별빛이 3차원 구 형태로 퍼지는 모습을 2차원 단면으로 단순화하여 표현한 시뮬레이션입니다.</p>

<div class="controls">
  <div class="slider-row">
    <span>가까이</span>
    <input type="range" id="distSlider" min="1" max="3" step="1" value="1">
    <span>멀리</span>
  </div>
  <div class="jump-btns">
    <button data-r="1">1r</button>
    <button data-r="2">2r</button>
    <button data-r="3">3r</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-pill">
    <div class="label">별까지의 거리</div>
    <div class="value" id="statDist">1r</div>
  </div>
  <div class="stat-pill">
    <div class="label">별의 밝기</div>
    <div class="value" id="statBright">1배</div>
  </div>
</div>

<div class="stage-wrap">
  <div class="legend">
    <div><span class="dot" style="background:#ffe082;"></span>별빛이 퍼지는 구 (단면)</div>
    <div><span class="dot" style="background:#FFD54F;"></span>우리가 보는 부분</div>
    <div><span class="dot" style="background:#8a99ad;"></span>다른 방향의 관측 지점</div>
  </div>
  <div class="formula-badge">별의 밝기 ∝ 1 / r²</div>
  <canvas id="mainCanvas" width="1000" height="900"></canvas>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const R_MAX = 3;
const MARGIN = 55;
const OBSERVER_SPACE = 130;
// 별을 중심으로 한 구 전체(위/아래/왼쪽 포함)가 캔버스 안에 다 들어오도록 반지름을 계산
const R_TOTAL = Math.min(H / 2 - MARGIN, (W - OBSERVER_SPACE - 2 * MARGIN) / 2);
const UNIT_R = R_TOTAL / R_MAX;
const STAR = { x: MARGIN + R_TOTAL, y: H / 2 };
const K = UNIT_R * 0.16;

function screenX(r){ return STAR.x + UNIT_R * r; }
function halfSize(r){ return K * r; }
function brightness(r){ return 1 / (r * r); }
function areaMul(r){ return r * r; }
function fracLabel(r){ return r === 1 ? '1배' : `1/${r * r}배`; }
// 화면 표현용 밝기: 실제 밝기(1/r^2)를 그대로 쓰면 1r과 2r 사이 대비가 너무 급격해 보여서,
// 눈에 보이는 대비를 완만하게 만들기 위해 제곱근(1/r)을 사용함. 수치 라벨은 실제 값(fracLabel)을 그대로 표시.
function visualBrightness(r){ return 1 / r; }

// 밝을 때(hot)와 어두울 때(dim)의 색을 밝기(b, 0~1)에 따라 섞어 대비를 키움
function mixColor(b, hot, dim){
  const t = Math.max(0, Math.min(1, b));
  const c = hot.map((h, i) => Math.round(dim[i] + (h - dim[i]) * t));
  return c.join(',');
}

let currentR = 1;

const bgStars = [];
for (let i = 0; i < 90; i++) {
  bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3, a: Math.random() * 0.6 + 0.3 });
}

const NUM_RAYS = 28;

function draw(){
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0c1524');
  bg.addColorStop(1, '#050810');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  bgStars.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  drawOmniRays();
  drawGlowSphere();
  drawReferenceCircles();
  drawObserverWedge();
  drawOtherDirectionPatches(currentR);

  for (let r = 1; r <= R_MAX; r++) {
    if (r !== currentR) drawPatch(r, false);
  }
  drawPatch(currentR, true);
  drawStar();
}

// 별빛이 사방으로 퍼져나가는 것을 표현하는 방사선 - 별에서 멀어질수록(밝기가 줄수록) 옅어짐
function drawOmniRays(){
  ctx.save();
  const maxLen = UNIT_R * R_MAX;
  for (let i = 0; i < NUM_RAYS; i++) {
    const angle = (i / NUM_RAYS) * Math.PI * 2;
    const x2 = STAR.x + Math.cos(angle) * maxLen;
    const y2 = STAR.y + Math.sin(angle) * maxLen;
    const grad = ctx.createLinearGradient(STAR.x, STAR.y, x2, y2);
    grad.addColorStop(0, 'rgba(255,241,190,0.32)');
    grad.addColorStop(1, 'rgba(255,224,130,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(STAR.x, STAR.y);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.restore();
}

// 다른 방향에도 똑같이 별빛이 닿고 있다는 것을 보여주는 참고 관측 지점들
// (오른쪽에 표시되는 메인 관측 지점과 동일한 방식으로 그려서 사방이 같다는 걸 보여줌)
function drawOtherDirectionPatches(r){
  const pb = visualBrightness(r);
  const radius = UNIT_R * r;
  const hs = halfSize(r);
  const angles = [70, 150, 230, 310]; // 오른쪽(0도, 메인 관측 지점)을 피한 다른 방향들
  ctx.save();
  angles.forEach(deg => {
    const rad = deg * Math.PI / 180;
    const cx = STAR.x + Math.cos(rad) * radius;
    const cy = STAR.y + Math.sin(rad) * radius;

    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(STAR.x, STAR.y);
    ctx.lineTo(cx, cy);
    ctx.stroke();

    drawGlowPatch(cx, cy, hs, r, pb, false);
  });
  ctx.restore();
}

// 반짝이는 관측 패치(격자 + 테두리)를 그리는 공용 함수 - 메인 방향과 다른 방향 모두에 사용
function drawGlowPatch(cx, cy, hs, r, pb, showLabel){
  ctx.save();
  const fillRgb = mixColor(pb, [255,193,80], [80,72,76]);
  const edgeRgb = mixColor(pb, [255,213,79], [130,115,110]);

  ctx.shadowColor = `rgba(${fillRgb},0.85)`;
  ctx.shadowBlur = 18 * pb + 2;
  ctx.fillStyle = `rgba(${fillRgb},${0.18 + 0.6 * pb})`;
  ctx.fillRect(cx - hs, cy - hs, hs * 2, hs * 2);
  ctx.shadowBlur = 0;

  ctx.strokeStyle = `rgba(255,255,255,${0.18 + 0.32 * pb})`;
  ctx.lineWidth = 1;
  const cell = (hs * 2) / r;
  for (let i = 1; i < r; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - hs + i * cell, cy - hs);
    ctx.lineTo(cx - hs + i * cell, cy + hs);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - hs, cy - hs + i * cell);
    ctx.lineTo(cx + hs, cy - hs + i * cell);
    ctx.stroke();
  }
  ctx.strokeStyle = `rgb(${edgeRgb})`;
  ctx.lineWidth = 2.2;
  ctx.strokeRect(cx - hs, cy - hs, hs * 2, hs * 2);

  if (showLabel) {
    ctx.fillStyle = `rgb(${edgeRgb})`;
    ctx.font = 'bold 19px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(r === 1 ? '거리 r' : `거리 ${r}r`, cx, cy - hs - 36);
    ctx.fillStyle = `rgb(${mixColor(pb, [255,138,101], [150,120,110])})`;
    ctx.font = 'bold 21px Segoe UI';
    ctx.fillText(fracLabel(r), cx, cy - hs - 12);
  }
  ctx.restore();
}

// 광택 있는 3D 공처럼 보이도록 중심을 살짝 벗어난 하이라이트를 넣은 구 형태
function drawShadedSphere(cx, cy, r, rgb, alpha){
  ctx.save();
  const hlx = cx - r * 0.3, hly = cy - r * 0.3;
  const g = ctx.createRadialGradient(hlx, hly, r * 0.02, cx, cy, r * 1.02);
  g.addColorStop(0,    `rgba(${rgb},${0.9 * alpha})`);
  g.addColorStop(0.35, `rgba(${rgb},${0.45 * alpha})`);
  g.addColorStop(0.75, `rgba(${rgb},${0.18 * alpha})`);
  g.addColorStop(1,    `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = `rgba(${rgb},${0.4 * alpha})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// 별빛이 도달한 범위를 입체 구로 표현 - 멀어질수록 옅어짐(완만한 시각적 대비 사용)
function drawGlowSphere(){
  const radius = UNIT_R * currentR;
  const pb = visualBrightness(currentR);
  const rgb = mixColor(pb, [255,241,190], [110,105,112]);
  drawShadedSphere(STAR.x, STAR.y, radius, rgb, 0.55 * pb + 0.18);
}

// 1r, 2r, 3r 기준 구
function drawReferenceCircles(){
  ctx.save();
  ctx.font = '13px Segoe UI';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.textAlign = 'center';
  for (let r = 1; r <= R_MAX; r++) {
    const radius = UNIT_R * r;
    drawShadedSphere(STAR.x, STAR.y, radius, '180,200,220', 0.22);
    ctx.fillText(`${r}r`, STAR.x, STAR.y - radius - 8);
  }
  ctx.restore();
}

// 관측자가 바라보는 좁은 부채꼴(우리가 실제로 보는 부분)
function drawObserverWedge(){
  const farX = screenX(R_MAX);
  const hs = halfSize(R_MAX);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(STAR.x, STAR.y);
  ctx.lineTo(farX, STAR.y - hs);
  ctx.moveTo(STAR.x, STAR.y);
  ctx.lineTo(farX, STAR.y + hs);
  ctx.stroke();
  ctx.restore();
}

function drawPatch(r, active){
  const x = screenX(r), hs = halfSize(r);
  ctx.save();
  if (active) {
    drawGlowPatch(x, STAR.y, hs, r, visualBrightness(r), true);
  } else {
    ctx.globalAlpha = 0.32;
    ctx.fillStyle = '#8a99ad';
    ctx.fillRect(x - hs, STAR.y - hs, hs * 2, hs * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - hs, STAR.y - hs, hs * 2, hs * 2);
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = '#9fb0c4';
    ctx.font = '13px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(r === 1 ? 'r' : `${r}r`, x, STAR.y - hs - 8);
  }
  ctx.restore();
}

function drawStar(){
  ctx.save();
  const g = ctx.createRadialGradient(STAR.x, STAR.y, 0, STAR.x, STAR.y, 34);
  g.addColorStop(0, '#fffdf0');
  g.addColorStop(0.4, '#ffe082');
  g.addColorStop(1, 'rgba(255,193,7,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(STAR.x, STAR.y, 34, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff8e1';
  ctx.beginPath();
  ctx.arc(STAR.x, STAR.y, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function updateStats(){
  document.getElementById('statDist').textContent = currentR === 1 ? '1r (기준)' : `${currentR}r`;
  document.getElementById('statBright').textContent = fracLabel(currentR);
  document.querySelectorAll('.jump-btns button').forEach(b => {
    b.classList.toggle('active', +b.dataset.r === currentR);
  });
}

function setR(r){
  currentR = r;
  document.getElementById('distSlider').value = r;
  updateStats();
  draw();
}

document.getElementById('distSlider').addEventListener('input', e => setR(+e.target.value));
document.querySelectorAll('.jump-btns button').forEach(b => {
  b.addEventListener('click', () => setR(+b.dataset.r));
});

setR(1);
</script>
</body>
</html>
